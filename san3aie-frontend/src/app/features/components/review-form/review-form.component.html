<div class="rounded-2xl border border-slate-200 bg-white p-6" dir="rtl">
  <h2 class="text-xl font-black text-slate-900">قيّم الخدمة</h2>

  <p class="mt-2 text-sm text-slate-500">شاركنا تجربتك مع الصنايعي.</p>

  <div class="mt-5">
    <p class="mb-3 text-sm font-bold text-slate-700">التقييم</p>

    <div class="flex gap-2">
      @for (star of [1, 2, 3, 4, 5]; track star) {
        <button
          type="button"
          (click)="setRating(star)"
          class="text-3xl transition"
          [class.text-amber-400]="star <= rating"
          [class.text-slate-300]="star > rating"
        >
          ★
        </button>
      }
    </div>

    @if (submitted && rating === 0) {
      <p class="mt-2 text-sm font-semibold text-red-600">
        من فضلك اختر التقييم.
      </p>
    }
  </div>

  <div class="mt-5">
    <label class="mb-2 block text-sm font-bold text-slate-700"> تعليق </label>

    <textarea
      [(ngModel)]="comment"
      rows="4"
      maxlength="1000"
      placeholder="اكتب رأيك في الخدمة..."
      class="w-full rounded-xl border border-slate-200 px-4 py-3 outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
    ></textarea>
  </div>

  <button
    type="button"
    (click)="submit()"
    [disabled]="loading"
    class="mt-5 rounded-xl bg-emerald-600 px-6 py-3 font-bold text-white transition hover:bg-emerald-700 disabled:opacity-50"
  >
    {{ loading ? "جاري الإرسال..." : "إرسال التقييم" }}
  </button>
</div>
