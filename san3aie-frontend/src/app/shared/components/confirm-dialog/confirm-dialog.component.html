@if (open) {
  <div
    class="fixed inset-0 z-[90] flex items-center justify-center bg-slate-900/50 px-4"
    role="dialog"
    aria-modal="true"
  >
    <div class="w-full max-w-md rounded-3xl bg-white p-6 shadow-2xl">

      <h2 class="text-xl font-extrabold text-slate-900">
        {{ title }}
      </h2>

      <p class="mt-3 leading-7 text-slate-500">
        {{ message }}
      </p>

      <div class="mt-6 flex gap-3">

        <button
          type="button"
          (click)="confirmed.emit()"
          class="flex-1 rounded-xl bg-red-600 px-4 py-3 font-bold text-white hover:bg-red-700"
        >
          تأكيد
        </button>

        <button
          type="button"
          (click)="cancelled.emit()"
          class="flex-1 rounded-xl border border-slate-300 px-4 py-3 font-bold text-slate-700 hover:bg-slate-50"
        >
          إلغاء
        </button>

      </div>

    </div>
  </div>
}
